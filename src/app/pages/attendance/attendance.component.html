<div class="h-screen w-full flex flex-col bg-gray-50 overflow-hidden">
  <!-- App Bar equivalent -->
  <div class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between z-10">
    <h1 class="text-xl font-bold">Hii {{ EmpName }}</h1>
  </div>

  <!-- Tab Controller Equivalent -->
  <div class="px-2 pt-2">
    <div class="flex border-b border-gray-200">
      <button
        class="flex-1 py-3 text-center font-medium"
        [ngClass]="activeTab === 'Attendance' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'"
        (click)="activeTab = 'Attendance'">
        Attendance
      </button>
      <button
        class="flex-1 py-3 text-center font-medium"
        [ngClass]="activeTab === 'Feed' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'"
        (click)="activeTab = 'Feed'">
        Feed
      </button>
    </div>
  </div>

  <!-- Tab Content -->
  <div class="flex-1 overflow-y-auto p-2 pb-20">
    <!-- Tab 1: Attendance -->
    <div *ngIf="activeTab === 'Attendance'" class="flex flex-col gap-4">

      <!-- Card1 equivalent -->
      <div class="bg-[#ecf4f7] rounded-lg shadow-md p-4 flex flex-col items-center">
        <div class="flex justify-center items-center gap-4 text-gray-600 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
          </svg>
        </div>

        <p class="text-lg font-medium text-black text-center mb-6">General time 9:30 AM to 6:30 PM</p>

        <div class="flex justify-around w-full gap-4">
          <button (click)="_saveattendance('in')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-200 shadow-sm flex-1">
            Check In
          </button>
          <button (click)="_saveattendance('out')" class="bg-white border-2 border-blue-600 text-blue-600 hover:bg-gray-50 font-bold py-2 px-6 rounded-md transition duration-200 shadow-sm flex-1">
            Check Out
          </button>
        </div>
      </div>

      <!-- Calendar equivalent -->
      <div class="bg-white rounded-lg shadow-md p-2 w-full custom-calendar">
        <ejs-calendar
          id="calendar"
          width="100%"
          (navigated)="onViewChanged($event)"
          (renderDayCell)="customDates($event)">
        </ejs-calendar>
      </div>

      <!-- Latecard equivalent -->
      <div *ngIf="isLoadingRecent" class="flex justify-center p-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      </div>

      <div *ngIf="!isLoadingRecent && recentError" class="text-red-500 text-center p-4">
        Error: {{ recentError }}
      </div>

      <div *ngIf="!isLoadingRecent && !recentError && recentattendance.length > 0"
           class="bg-gray-100 rounded-lg shadow-sm p-4 mb-4 border-l-4 border-orange-400 cursor-pointer"
           (click)="navigateToReport()">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-gray-800">{{ recentattendance[0].CurrentMonthYear }}</h3>
            <p class="text-sm text-gray-600">{{ recentattendance[0].PunchDate | date:'mediumDate' }}</p>
          </div>
          <div class="text-right">
            <span class="inline-block bg-orange-100 text-orange-800 rounded-full px-3 py-1 text-sm font-semibold">
              Late: {{ recentattendance[0].LateByFormatted }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: Feed -->
    <div *ngIf="activeTab === 'Feed'" class="flex justify-center items-center h-40">
      <p class="text-gray-500 text-lg">Second tab</p>
    </div>
  </div>

</div>
